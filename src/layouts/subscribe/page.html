{{ define "main" }}
<div class="row justify-content-center">
  <div class="col-md-12 col-lg-9">
    <div class="page-header">
      <h1>{{ .Params.h1 | default .Title }}</h1>
      {{ with .Params.definition }}<p class="lead">{{ . }}</p>{{ end }}
    </div>
    {{ partial "subscribe.html" . }}
    {{ with .Content }}<div class="mt-4">{{ . }}</div>{{ end }}
  </div>
</div>
{{ end }}
