{{/* `.` is a slice of pages. */}}
<ul class="entry-list">
  {{ range . }}
  <li>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="meta"><span class="type-badge">{{ .Params.type }}</span><span>{{ .Date.Format "2 Jan 2006" }}</span></p>
    {{ with .Params.definition }}<p>{{ . }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
