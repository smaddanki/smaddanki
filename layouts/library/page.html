{{ define "main" }}
<div class="row justify-content-center">
  <div class="col-md-12 col-lg-9">
    <div class="page-header">
      <h1>{{ .Params.h1 | default .Title }}</h1>
      {{ with .Params.definition }}<p class="lead">{{ . }}</p>{{ end }}
    </div>
    {{ with .Params.library }}
    <dl class="row">
      <dt class="col-sm-3">Kind</dt><dd class="col-sm-9">{{ .kind }}</dd>
      <dt class="col-sm-3">Version</dt><dd class="col-sm-9">{{ .version }}</dd>
      <dt class="col-sm-3">Checked against</dt><dd class="col-sm-9">{{ .checkedAgainst }}</dd>
      <dt class="col-sm-3">Repository</dt><dd class="col-sm-9"><a href="{{ .repo }}">{{ .repo }}</a></dd>
    </dl>
    {{ end }}
    {{ .Content }}
  </div>
</div>
{{ end }}
