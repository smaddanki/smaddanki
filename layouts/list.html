{{ define "main" }}
<div class="wrap">
  <header class="article-head">
    <h1>{{ .Params.h1 | default .Title }}</h1>
    {{ with .Params.definition }}<p class="definition">{{ . }}</p>{{ end }}
  </header>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  {{ partial "entry-list.html" .Pages.ByDate.Reverse }}
</div>
{{ end }}
