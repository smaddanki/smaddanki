{{ define "main" }}
{{/* Archive for now: every published article, reverse-chronological. */}}
<div class="row justify-content-center">
  <div class="col-md-12 col-lg-9">
    <div class="page-header">
      <h1>{{ site.Title }}</h1>
      <p class="lead">{{ site.Params.description }}</p>
    </div>
    {{ partial "entry-list.html" (where site.RegularPages "Section" "writing").ByDate.Reverse }}
    {{ partial "subscribe.html" . }}
  </div>
</div>
{{ end }}
