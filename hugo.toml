baseURL = "https://smaddanki.com/"
locale = "en-gb"
title = "Smaddanki"
enableRobotsTXT = true
enableEmoji = false
summaryLength = 40

[params]
  description = "Writing on agent data layers, silent failure, risk and controls, the real TCO of agents, and the changing data function."
  author = "Sudhamshu Addanki"
  legalEntity = "Smaddanki LTD"
  linkedin = ""
  subscribeEndpoint = ""
  tagPageThreshold = 3

[taxonomies]
  pillar = "pillar"
  tag = "tags"

[permalinks]
  writing = "/writing/:contentbasename/"
  library = "/library/:contentbasename/"

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[markup.highlight]
  noClasses = false
  lineNos = false

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["HTML", "RSS", "llms"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[sitemap]
  changefreq = ""
  priority = -1

[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^VERCEL_']
