# Hooks matched to this repo: a Hugo site, with one Python script under scripts/.
# The previous config was inherited from a Python project and referenced a
# pyproject.toml that does not exist here.
default_language_version:
  python: python3
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^node_modules/
      - id: end-of-file-fixer
        exclude: ^node_modules/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^scripts/.*\.py$

  # Content must pass the same validation the build runs.
  - repo: local
    hooks:
      - id: validate-content
        name: validate front matter and tags
        entry: python3 scripts/validate.py
        language: system
        pass_filenames: false
        files: ^src/(content|data)/
